# .github/workflows/build-test.yml
# Android SDK build & unit tests (JDK 17, same as jitpack.yml)
name: Build & Test

on:
  push:
    branches: [main]
  pull_request:          # every base branch, so stacked PRs are verified too
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # Run the wrapper directly (no `bash` prefix): a lost executable bit on gradlew fails here.
      - name: Unit tests (sdk)
        run: ./gradlew --no-daemon :sdk:testDebugUnitTest

      - name: Build SDK AAR (release)
        run: ./gradlew --no-daemon :sdk:assembleRelease

      - name: Build sample app (debug)
        run: ./gradlew --no-daemon :sample:assembleDebug

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sdk-test-reports
          path: sdk/build/reports/tests/
